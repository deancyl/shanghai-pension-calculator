name: Build Android APK and Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (leave empty for auto v2026.1.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShanghaiPensionCalculator-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2026.1.${{ github.run_number }}"
          fi
          RELEASE_TITLE="上海退休金计算器 $TAG_NAME"
          APK_FILE="ShanghaiPensionCalculator-$TAG_NAME.apk"

          cp app/build/outputs/apk/release/*.apk "$APK_FILE"

          echo "Publishing release $TAG_NAME with asset $APK_FILE..."
          gh release create "$TAG_NAME" "$APK_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "### 🚀 上海退休金计算器 Android 发布 ($TAG_NAME)

          - **可安装 APK**：[\`$APK_FILE\`](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$APK_FILE)
          - **政策热更新**：启动自动联网同步上海市社保上下限与养老金计发基数（来自云端 \`remote-policy/policy_config.json\`）。
          - **构建详情**：由 GitHub Actions 自动化编译，对应提交 [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})。"
